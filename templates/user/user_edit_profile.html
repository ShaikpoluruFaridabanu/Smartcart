{% extends 'base.html' %}

{% block title %}Edit Profile | SmartCart{% endblock %}

{% block content %}

<div class="auth-wrap">
    <section class="auth-card">

        <p class="eyebrow">Account Settings</p>
        <h2>Edit Your Profile</h2>

        <form method="POST" action="{{ url_for('user_edit_profile') }}">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    name="name"
                    value="{{ user.name }}"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    value="{{ user.email }}"
                    readonly
                >
                <small>Email address cannot be changed here.</small>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input
                    type="tel"
                    name="phone"
                    value="{{ user.phone }}"
                    placeholder="Enter 10-digit phone number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    required
                >
            </div>

            <button type="submit" class="btn-full">
                Save Changes
            </button>

            <div class="auth-links">
                <a href="{{ url_for('user_profile') }}">
                    Cancel
                </a>
            </div>

        </form>

    </section>
</div>

{% endblock %}
